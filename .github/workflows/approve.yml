name: Approve and Build MVP

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  check-approve:
    # /approve コメントかつ pain-report ラベル付き Issue のみ
    if: |
      github.event.comment.body == '/approve' &&
      contains(github.event.issue.labels.*.name, 'pain-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest pipeline_state.json from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # /spec 直後の /approve でも race を避けるため、リモートの最新を取り直す
          mkdir -p data
          gh api "repos/${{ github.repository }}/contents/data/pipeline_state.json" \
            --jq '.content' 2>/dev/null | base64 -d > data/pipeline_state.json || \
            echo '{"picked": []}' > data/pipeline_state.json

      - name: Validate approver
        id: validate-approver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMENTER="${{ github.event.comment.user.login }}"
          OWNER=$(gh repo view --json owner -q '.owner.login')
          if [ "$COMMENTER" != "$OWNER" ]; then
            echo "::warning::Unauthorized approver: $COMMENTER"
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ リポジトリオーナーのみ承認できます。"
            exit 1
          fi

      - name: Validate picked & spec
        id: validate-spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PICKED_CHECK=$(python3 -c "
          import json, os
          state_path = 'data/pipeline_state.json'
          if not os.path.exists(state_path):
              print('NO_STATE')
              raise SystemExit
          state = json.load(open(state_path))
          for item in state.get('picked', []):
              if item['issue_number'] == int(os.environ['ISSUE_NUMBER']):
                  print(item.get('spec') or 'NO_SPEC')
                  raise SystemExit
          print('NOT_PICKED')
          ")

          if [ "$PICKED_CHECK" = "NO_STATE" ] || [ "$PICKED_CHECK" = "NOT_PICKED" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "❌ この Issue は picked されていません。先に \`/pick\` → \`/spec\` を実行してください。"
            exit 1
          fi

          if [ "$PICKED_CHECK" = "NO_SPEC" ] || [ ! -f "$PICKED_CHECK" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "❌ Spec ファイルが見つかりません。\`/spec\` を実行してから再度 \`/approve\` してください。"
            exit 1
          fi

          SPEC_FILE="$PICKED_CHECK"

          echo "spec_file=$SPEC_FILE" >> "$GITHUB_OUTPUT"
          echo "✅ Spec found: $SPEC_FILE"

      - name: Update status to building
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "building"
          gh issue comment "$ISSUE_NUMBER" --body "🚀 承認されました。自動実装を開始します..."

          python3 -c "
          import json, os
          state_path = 'data/pipeline_state.json'
          if not os.path.exists(state_path):
              exit(0)
          state = json.load(open(state_path))
          for item in state.get('picked', []):
              if item['issue_number'] == int(os.environ['ISSUE_NUMBER']):
                  item['status'] = 'building'
                  break
          json.dump(state, open(state_path, 'w'), indent=2, ensure_ascii=False)
          "

          # pipeline_state.json を GitHub API で直接更新（Branch Protection バイパス）
          EXISTING_SHA=$(gh api "repos/${{ github.repository }}/contents/data/pipeline_state.json" --jq '.sha' 2>/dev/null || echo "")
          UPDATED_CONTENT=$(cat data/pipeline_state.json | base64 -w 0)

          if [ -n "$EXISTING_SHA" ]; then
            gh api "repos/${{ github.repository }}/contents/data/pipeline_state.json" \
              -X PUT \
              -f message="pipeline: #$ISSUE_NUMBER のステータスを building に更新" \
              -f content="$UPDATED_CONTENT" \
              -f sha="$EXISTING_SHA" \
              > /dev/null
            echo "✅ pipeline_state.json を更新しました"
          else
            gh api "repos/${{ github.repository }}/contents/data/pipeline_state.json" \
              -X PUT \
              -f message="pipeline: #$ISSUE_NUMBER のステータスを building に更新" \
              -f content="$UPDATED_CONTENT" \
              > /dev/null
            echo "✅ pipeline_state.json を作成しました"
          fi

      - name: Trigger mvp-factory build
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Spec ファイルの内容を base64 エンコードして渡す
          SPEC_CONTENT=$(base64 < "${{ steps.validate-spec.outputs.spec_file }}")

          # Deep Dive があれば同様に渡す
          DEEP_DIVE_CONTENT=""
          DEEP_DIVE_PATH=$(python3 -c "
          import json, os
          state_path = 'data/pipeline_state.json'
          if os.path.exists(state_path):
              state = json.load(open(state_path))
              for item in state.get('picked', []):
                  if item['issue_number'] == int(os.environ['ISSUE_NUMBER']):
                      print(item.get('deep_dive') or '')
                      break
          ")
          if [ -n "$DEEP_DIVE_PATH" ] && [ -f "$DEEP_DIVE_PATH" ]; then
            DEEP_DIVE_CONTENT=$(base64 < "$DEEP_DIVE_PATH")
          fi

          # Issue タイトルからプロダクト名を生成（LLM で英語ケバブケースに変換）
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title -q '.title')
          PRODUCT_NAME=$(python3 -c "
          import subprocess, re
          title = '''$TITLE'''
          # LLM でタイトルを英語ケバブケースに変換
          result = subprocess.run(
              ['gh', 'models', 'run', 'openai/gpt-4o-mini', '--',
               f'Convert this to a short English kebab-case product name (max 30 chars, only lowercase letters and hyphens, no explanation): {title}'],
              capture_output=True, text=True, timeout=30
          )
          name = result.stdout.strip().lower().replace(' ', '-')
          name = re.sub(r'[^a-z0-9-]', '', name).strip('-')[:30]
          if not name or name == '-':
              name = f'mvp-{$ISSUE_NUMBER}'
          print(name)
          ")

          gh workflow run build.yml \
            --repo kaionn/mvp-factory \
            -f issue_number="$ISSUE_NUMBER" \
            -f source_repo="${{ github.repository }}" \
            -f spec_content="$SPEC_CONTENT" \
            -f deep_dive_content="$DEEP_DIVE_CONTENT" \
            -f product_name="$PRODUCT_NAME"

          echo "✅ mvp-factory の build.yml を dispatch しました（product: $PRODUCT_NAME）"
