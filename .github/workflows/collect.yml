name: Collect Pains

on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = JST 5:00
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Set up and validate LLM
        uses: ./.github/actions/setup-llm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"

      - name: Run pain collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: uv run python -m src.main

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily/ deep_dive/
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "$(date -u +%Y-%m-%d) のペインレポートを追加"
            git push
          fi
