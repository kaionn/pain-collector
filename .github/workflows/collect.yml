name: Collect Pains

on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = JST 5:00
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  issues: write

# Slack-only default. Explicit discord/shadow values are retained for rollback.
env:
  NOTIFICATION_MODE: ${{ vars.NOTIFICATION_MODE || 'slack' }}
  NOTIFY_DURABLE_LEDGER: ${{ vars.NOTIFY_DURABLE_LEDGER || 'false' }}
  SLACK_ALERT_CHANNEL_ID: ${{ vars.SLACK_ALERT_CHANNEL_ID }}
  SLACK_REPORT_CHANNEL_ID: ${{ vars.SLACK_REPORT_CHANNEL_ID }}

jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Set up and validate LLM
        uses: ./.github/actions/setup-llm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"

      - name: Run pain collector
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTIFY_LEDGER_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ (vars.NOTIFICATION_MODE == 'discord' || vars.NOTIFICATION_MODE == 'shadow') && secrets.DISCORD_WEBHOOK_URL || '' }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: uv run python -m src.main

      - name: Snapshot generated report Markdown before persistence
        run: uv run python -m src.report_persistence snapshot --backup "$RUNNER_TEMP/collected-reports"

      - name: Preserve generated report Markdown
        uses: actions/upload-artifact@v4
        with:
          name: collected-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/collected-reports/reports/daily/*.md
            ${{ runner.temp }}/collected-reports/reports/deep_dive/*.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push reports with bounded race retries
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv run python -m src.report_persistence persist --backup "$RUNNER_TEMP/collected-reports" --message "$(date -u +%Y-%m-%d) のペインレポートを追加"

      - name: Preserve notification delivery receipts and sanitized recovery outbox
        if: ${{ always() && (env.NOTIFICATION_MODE == 'shadow' || env.NOTIFICATION_MODE == 'slack') }}
        uses: actions/upload-artifact@v4
        with:
          name: slack-delivery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            .notification-state/*.json
            .notification-outbox/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      - name: Audit primary notification completion after business work
        if: ${{ always() && env.NOTIFICATION_MODE == 'slack' }}
        run: python3 src/notify_bridge.py --audit
