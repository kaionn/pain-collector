name: Learn from Feedback

on:
  schedule:
    - cron: "30 20 * * 6" # 週次の後に実行（毎週土曜 UTC 20:30 = 日曜 JST 5:30）
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  learn:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT 所有者の権限を使用。branch protection/ruleset の許可が別途必要
          token: ${{ secrets.PAT_TOKEN }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Set up and validate LLM
        uses: ./.github/actions/setup-llm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"

      - name: Learn from feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --learn

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feedback_rules.json
          if git diff --cached --quiet; then
            echo "No changes to feedback rules"
          else
            git commit -m "フィードバックルールを自動更新"
            git push
          fi
