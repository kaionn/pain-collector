name: Learn from Feedback

on:
  schedule:
    - cron: "30 20 * * 6" # 週次の後に実行（毎週土曜 UTC 20:30 = 日曜 JST 5:30）
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  learn:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Learn from feedback
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --learn

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feedback_rules.json
          if git diff --cached --quiet; then
            echo "No changes to feedback rules"
          else
            git commit -m "フィードバックルールを自動更新"
            git push
          fi
