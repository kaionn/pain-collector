name: Monitor stalled builds

on:
  schedule:
    # 1 時間ごとに実行 (UTC)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      threshold_hours:
        description: '停滞と判定する閾値時間'
        required: false
        default: '24'
        type: string
      dry_run:
        description: 'true なら検出のみで state は更新しない'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  issues: write

jobs:
  detect-stalled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest pipeline_state.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m src.state_sync fetch \
            --repo "${{ github.repository }}" \
            --remote-path data/pipeline_state.json \
            --local-path data/pipeline_state.json

      - name: Detect stalled builds
        id: detect
        env:
          STALLED_THRESHOLD_HOURS: ${{ github.event.inputs.threshold_hours || '24' }}
        run: |
          set -euo pipefail
          python3 -m src.monitor_stalled \
            --state data/pipeline_state.json \
            --output stalled.json
          COUNT=$(jq -r '.stalled_count' stalled.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Detected $COUNT stalled issue(s)"
          if [ "$COUNT" -gt 0 ]; then
            cat stalled.json
          fi

      - name: Notify and update state
        if: steps.detect.outputs.count != '0' && github.event.inputs.dry_run != 'true'
        env:
          # contents API PUT は Branch Protection をバイパスするため PAT_TOKEN が必要
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          STALLED_THRESHOLD_HOURS: ${{ github.event.inputs.threshold_hours || '24' }}
        run: |
          set -euo pipefail

          # state を更新（apply モード）
          python3 -m src.monitor_stalled \
            --state data/pipeline_state.json \
            --output stalled.json \
            --apply

          # 各 stalled Issue に対してラベル変更とコメント
          python3 -m src.workflow_alerts stalled-issues --summary stalled.json

          # GitHub API 経由で pipeline_state.json を更新（branch protection バイパス）
          python3 -m src.state_sync push \
            --repo "${{ github.repository }}" \
            --remote-path data/pipeline_state.json \
            --local-path data/pipeline_state.json \
            --message "pipeline: stalled 検出による status 更新"

      - name: Notify Discord
        if: steps.detect.outputs.count != '0' && github.event.inputs.dry_run != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL 未設定のため Discord 通知をスキップ"
            exit 0
          fi
          python3 -m src.workflow_alerts discord --summary stalled.json
