name: Monthly Report

on:
  schedule:
    - cron: "0 21 1 * *" # 毎月1日 UTC 21:00 = JST 6:00
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  models: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch Protection バイパスには PAT が必要（GITHUB_TOKEN では push が拒否される）
          token: ${{ secrets.PAT_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Generate monthly report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --monthly

      - name: Cross analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --cross-analysis

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --dashboard

      - name: Portfolio snapshot
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --portfolio

      - name: Validate top ideas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --validate

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monthly/ docs/ portfolio/
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "$(date -u +%Y-%m) の月次レポートを追加"
            git push
          fi
