name: Monthly Report

on:
  schedule:
    - cron: "0 21 1 * *" # 毎月1日 UTC 21:00 = JST 6:00
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v7
        with:
          # PAT 所有者の権限を使用。branch protection/ruleset の許可が別途必要
          token: ${{ secrets.PAT_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Set up and validate LLM
        uses: ./.github/actions/setup-llm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"

      - name: Generate monthly report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --monthly

      - name: Cross analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --cross-analysis

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --dashboard

      - name: Portfolio snapshot
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --portfolio

      - name: Validate top ideas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --validate

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monthly/ docs/ portfolio/
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "$(date -u +%Y-%m) の月次レポートを追加"
            git push
          fi
