name: Weekly Trend Analysis

on:
  schedule:
    - cron: "0 20 * * 6" # 毎週土曜 UTC 20:00 = 日曜 JST 5:00
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  issues: write

# Slack-only default. Explicit discord/shadow values are retained for rollback.
env:
  NOTIFICATION_MODE: ${{ vars.NOTIFICATION_MODE || 'slack' }}
  NOTIFY_DURABLE_LEDGER: ${{ vars.NOTIFY_DURABLE_LEDGER || 'false' }}
  SLACK_ALERT_CHANNEL_ID: ${{ vars.SLACK_ALERT_CHANNEL_ID }}
  SLACK_REPORT_CHANNEL_ID: ${{ vars.SLACK_REPORT_CHANNEL_ID }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT 所有者の権限を使用。branch protection/ruleset の許可が別途必要
          token: ${{ secrets.PAT_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Set up and validate LLM
        uses: ./.github/actions/setup-llm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"

      - name: Run weekly analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --weekly

      - name: Score unscored issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --score-issues

      - name: Issue cleanup
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --cleanup

      - name: Pick idea
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTIFY_LEDGER_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ (vars.NOTIFICATION_MODE == 'discord' || vars.NOTIFICATION_MODE == 'shadow') && secrets.DISCORD_WEBHOOK_URL || '' }}
          DISCORD_BOT_TOKEN: ${{ (vars.NOTIFICATION_MODE == 'discord' || vars.NOTIFICATION_MODE == 'shadow') && secrets.DISCORD_BOT_TOKEN || '' }}
          DISCORD_CHANNEL_ID: ${{ (vars.NOTIFICATION_MODE == 'discord' || vars.NOTIFICATION_MODE == 'shadow') && secrets.DISCORD_CHANNEL_ID || '' }}
        run: uv run python -m src.main --pick-idea

      - name: Weekly deep dive (top 5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_EMBED_MODEL: ${{ vars.LLM_EMBED_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_CLAUDE_AUTH_MODE: ci-oauth
          CLAUDE_CODE_OAUTH_TOKEN: ${{ vars.LLM_PROVIDER == 'claude-cli' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          DISABLE_AUTOUPDATER: "1"
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --deep-dive-weekly

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # pick 空振り等で picks/ が未生成でも git add を fatal にしない
          for path in weekly/ picks/ deep_dive/ specs/ data/pipeline_state.json; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "$(date -u +%Y-%m-%d) の週次トレンドレポートを追加"
            git push
          fi

      - name: Preserve notification delivery receipts and sanitized recovery outbox
        if: ${{ always() && (env.NOTIFICATION_MODE == 'shadow' || env.NOTIFICATION_MODE == 'slack') }}
        uses: actions/upload-artifact@v4
        with:
          name: slack-delivery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            .notification-state/*.json
            .notification-outbox/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      - name: Audit primary notification completion after business work
        if: ${{ always() && env.NOTIFICATION_MODE == 'slack' }}
        run: python3 src/notify_bridge.py --audit
