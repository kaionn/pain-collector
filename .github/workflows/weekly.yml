name: Weekly Trend Analysis

on:
  schedule:
    - cron: "0 20 * * 6" # 毎週土曜 UTC 20:00 = 日曜 JST 5:00
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  issues: write
  models: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python -c "
          from datetime import datetime, timezone, timedelta;
          from src.weekly_trends import run;
          today = datetime.now(timezone(timedelta(hours=9))).date();
          run(today)
          "

      - name: Score unscored issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python -m src.main --score-issues

      - name: Issue cleanup
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python -m src.main --cleanup

      - name: Pick idea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python -m src.main --pick-idea

      - name: Weekly deep dive (top 5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python -m src.main --deep-dive-weekly

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly/ picks/ deep_dive/ specs/ data/pipeline_state.json
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "$(date -u +%Y-%m-%d) の週次トレンドレポートを追加"
            git push
          fi
