name: Weekly Trend Analysis

on:
  schedule:
    - cron: "0 20 * * 6" # 毎週土曜 UTC 20:00 = 日曜 JST 5:00
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  issues: write
  models: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.actor == 'kaionn'
    steps:
      - uses: actions/checkout@v7
        with:
          # Branch Protection バイパスには PAT が必要（GITHUB_TOKEN では push が拒否される）
          token: ${{ secrets.PAT_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run weekly analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --weekly

      - name: Score unscored issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --score-issues

      - name: Issue cleanup
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --cleanup

      - name: Pick idea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: uv run python -m src.main --pick-idea

      - name: Weekly deep dive (top 5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: uv run python -m src.main --deep-dive-weekly

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # pick 空振り等で picks/ が未生成でも git add を fatal にしない
          for path in weekly/ picks/ deep_dive/ specs/ data/pipeline_state.json; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new reports to commit"
          else
            git commit -m "$(date -u +%Y-%m-%d) の週次トレンドレポートを追加"
            git push
          fi
