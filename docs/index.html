<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pain Collector Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; }
  .stats { display: flex; gap: 20px; margin: 20px 0; }
  .stat { background: #161b22; padding: 20px; border-radius: 8px; flex: 1; text-align: center; border: 1px solid #30363d; }
  .stat-value { font-size: 2em; color: #58a6ff; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .chart-container { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
  canvas { max-height: 400px; }
</style>
</head>
<body>
<h1>Pain Collector Dashboard</h1>

<div class="stats">
  <div class="stat">
    <div class="stat-value">194</div>
    <div>Total Issues</div>
  </div>
  <div class="stat">
    <div class="stat-value">4</div>
    <div>Open Issues</div>
  </div>
</div>

<div class="charts">
  <div class="chart-container">
    <h3>カテゴリ分布</h3>
    <canvas id="catChart"></canvas>
  </div>
  <div class="chart-container">
    <h3>市場シグナル</h3>
    <canvas id="signalChart"></canvas>
  </div>
  <div class="chart-container">
    <h3>スコア分布</h3>
    <canvas id="scoreChart"></canvas>
  </div>
</div>

<script>
const colors = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#79c0ff','#56d364','#e3b341','#ff7b72','#d2a8ff'];

new Chart(document.getElementById('catChart'), {
  type: 'doughnut',
  data: { labels: ["🚫scope-out", "お金・家計", "テクノロジー", "仕事・キャリア", "健康・体調", "住まい・暮らし", "移動・通勤", "人間関係", "食事・料理", "子育て・育児", "👨‍💻dev", "👤consumer", "📌picked", "学習・スキル", "stalled", "pr-created", "趣味・娯楽"], datasets: [{ data: [56, 52, 48, 28, 26, 9, 9, 7, 7, 4, 3, 3, 2, 2, 2, 2, 1], backgroundColor: colors }] },
  options: { plugins: { legend: { labels: { color: '#c9d1d9' } } } }
});

new Chart(document.getElementById('signalChart'), {
  type: 'bar',
  data: { labels: ["🟢whitespace", "🟡underserved"], datasets: [{ label: '件数', data: [31, 16], backgroundColor: ['#3fb950','#d29922','#f85149'] }] },
  options: { scales: { y: { ticks: { color: '#c9d1d9' } }, x: { ticks: { color: '#c9d1d9' } } }, plugins: { legend: { display: false } } }
});

new Chart(document.getElementById('scoreChart'), {
  type: 'bar',
  data: { labels: ["🥇score-A", "🏆score-S"], datasets: [{ label: '件数', data: [49, 2], backgroundColor: ['#d29922','#3fb950','#58a6ff','#8b949e'] }] },
  options: { scales: { y: { ticks: { color: '#c9d1d9' } }, x: { ticks: { color: '#c9d1d9' } } }, plugins: { legend: { display: false } } }
});
</script>
</body>
</html>
