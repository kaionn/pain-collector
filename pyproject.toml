[project]
name = "pain-collector"
version = "0.1.0"
description = "SNS・レビューサイトからペインを収集し LLM で構造化・分析して MVP 候補を選定するパイプライン"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.0",
    "openai>=2.52.0",
    "scikit-learn>=1.4.0",
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
    "beautifulsoup4>=4.12.0",
    "google-play-scraper>=1.2.4",
    "pyyaml>=6.0.0",
    "jsonschema>=4.21.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "responses>=0.25.0",
]

[tool.uv]
package = false
